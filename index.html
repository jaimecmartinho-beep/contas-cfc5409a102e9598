<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Contas">
<meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b0d12" media="(prefers-color-scheme: dark)">
<meta name="format-detection" content="telephone=no">
<meta name="robots" content="noindex,nofollow">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Contas da Família</title>
<style>
:root{--bg:#f6f7f9;--surface:#fff;--surface2:#f9fafb;--text:#111827;--muted:#6b7280;--faint:#9ca3af;--border:#e5e7eb;--accent:#2563eb;--accent-soft:#eef3ff;--pos:#047857;--neg:#b91c1c;--warn:#b45309;
--c1:#2563eb;--c2:#0f766e;--c3:#7c3aed;--c4:#d97706;--c5:#db2777;--c6:#64748b;
--shadow:0 1px 2px rgba(16,24,40,.05);--r:12px;--s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:32px;--side:248px}
[data-theme=dark]{--bg:#0b0d12;--surface:#141821;--surface2:#10131a;--text:#e6e8ee;--muted:#9aa3b2;--faint:#6b7280;--border:#242a36;--accent:#6d9bff;--accent-soft:#18223a;--pos:#34d399;--neg:#f87171;--warn:#fbbf24;
--c1:#6d9bff;--c2:#2dd4bf;--c3:#a78bfa;--c4:#fbbf24;--c5:#f472b6;--c6:#94a3b8;--shadow:none}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.5 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
.num,td.n,.kpi .v{font-variant-numeric:tabular-nums}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:7px 10px;width:100%}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:-1px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);background:var(--surface);border-radius:8px;padding:7px 12px;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--surface2)}.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
[data-theme=dark] .btn.primary{color:#0b0d12}.btn.icon{padding:7px}.btn.ghost{border-color:transparent;background:none}.btn.sm{padding:4px 8px;font-size:12px}.btn.danger{color:var(--neg)}
/* shell */
.app{display:grid;grid-template-columns:var(--side) 1fr;min-height:100vh}
.app.collapsed{--side:64px}
aside{position:sticky;top:0;height:100vh;overflow:auto;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:10px;padding:16px;height:60px;border-bottom:1px solid var(--border);font-weight:600;letter-spacing:-.01em}
.logo{width:28px;height:28px;border-radius:8px;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:700;flex:none}
[data-theme=dark] .logo{color:#0b0d12}
.nav{padding:8px;flex:1}.grp{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);padding:14px 10px 6px}
.nav a{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:8px;color:var(--muted);text-decoration:none;cursor:pointer;white-space:nowrap}
.nav a:hover{background:var(--surface2);color:var(--text)}.nav a.on{background:var(--accent-soft);color:var(--accent);font-weight:500}
.nav a .ph{margin-left:auto;font-size:10px;color:var(--faint)}
.collapsed .grp,.collapsed .nav a span,.collapsed .brand span,.collapsed .nav a .ph{display:none}
.collapsed .nav a{justify-content:center}
.side-foot{padding:8px;border-top:1px solid var(--border)}
.topbar{position:sticky;top:0;z-index:20;height:60px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:var(--s3);padding:0 var(--s5)}
.topbar h1{font-size:16px;font-weight:600;margin:0;flex:1;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:6px 12px;cursor:pointer;color:var(--muted)}.seg button.on{background:var(--accent-soft);color:var(--accent);font-weight:500}
.topbar select{width:auto;max-width:160px}
main{padding:var(--s5);max-width:1440px;width:100%;margin:0 auto}
.phead{display:flex;align-items:flex-end;gap:var(--s3);margin-bottom:var(--s5);flex-wrap:wrap}
.phead h2{font-size:22px;margin:0;font-weight:600;letter-spacing:-.02em}.phead p{margin:2px 0 0;color:var(--muted)}
.phead .sp{flex:1}
.subtabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin:-8px 0 var(--s5);overflow-x:auto}
.subtabs button{border:0;background:none;padding:8px 12px;border-bottom:2px solid transparent;color:var(--muted);cursor:pointer;white-space:nowrap}.subtabs button:disabled{cursor:default}.subtabs.sticky{position:sticky;top:60px;z-index:15;background:var(--bg)}
.subtabs button.on{color:var(--text);border-bottom-color:var(--accent)}
.bottom{display:none}
#scrim{display:none}
@media(max-width:900px){
 .app,.app.collapsed{grid-template-columns:1fr;--side:272px}
 aside{position:fixed;left:0;top:0;z-index:40;width:272px;transform:translateX(-100%);transition:transform .2s}
 .app.drawer aside{transform:none}.app.drawer #scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:35}
 .collapsed .grp,.collapsed .nav a span,.collapsed .brand span{display:revert}.collapsed .nav a{justify-content:flex-start}
 #btnCollapse{display:none}.topbar{padding:0 var(--s4)}.topbar .seg{display:none}
 main{padding:var(--s4) var(--s4) 88px}
 .bottom{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--surface);border-top:1px solid var(--border);padding-bottom:env(safe-area-inset-bottom)}
 .bottom a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0;font-size:11px;color:var(--muted);cursor:pointer}
 .bottom a.on{color:var(--accent)}
 .mseg{display:flex!important}
}
.mseg{display:none;margin-bottom:var(--s4)}.mseg button{flex:1}
/* grid & cards */
.kpis{display:grid;gap:var(--s4);grid-template-columns:repeat(4,1fr);margin-bottom:var(--s4)}
@media(max-width:1100px){.kpis{grid-template-columns:repeat(2,1fr)}}
@media(max-width:520px){.kpis{gap:var(--s3)}}
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:var(--s4)}
.span-12{grid-column:span 12}.span-8{grid-column:span 8}.span-7{grid-column:span 7}.span-6{grid-column:span 6}.span-5{grid-column:span 5}.span-4{grid-column:span 4}.span-3{grid-column:span 3}
@media(max-width:1100px){.span-8,.span-7,.span-6,.span-5,.span-4{grid-column:span 12}.span-3{grid-column:span 6}}
@media(max-width:600px){.span-3{grid-column:span 12}}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow);min-width:0}
.ch{display:flex;align-items:center;gap:var(--s2);padding:14px var(--s4) 0}
.ch h3{font-size:14px;font-weight:600;margin:0;flex:1}.ch .acts{display:flex;gap:4px}
.ch .sub{color:var(--muted);font-size:12px;font-weight:400}
.cb{padding:var(--s4)}
.kpi{padding:var(--s4)}
.kpi .l{color:var(--muted);font-size:12px;display:flex;justify-content:space-between;gap:8px}
.kpi .v{font-size:24px;font-weight:600;letter-spacing:-.02em;margin:6px 0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .f{display:flex;align-items:flex-end;justify-content:space-between;gap:8px;min-height:28px}
.delta{font-size:12px;font-weight:500;white-space:nowrap}.delta.up{color:var(--pos)}.delta.down{color:var(--neg)}.delta.flat{color:var(--muted)}
.delta .m{color:var(--faint);font-weight:400}
@media(max-width:520px){.kpi .v{font-size:19px}.kpi{padding:var(--s3)}}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:28px 12px;color:var(--muted)}
.empty .ic{width:36px;height:36px;border-radius:50%;background:var(--surface2);border:1px solid var(--border);display:grid;place-items:center;color:var(--faint)}
.empty b{color:var(--text);font-weight:500}.empty small{font-size:12px;max-width:340px}
table{width:100%;border-collapse:collapse}th{text-align:left;font-weight:500;color:var(--muted);font-size:12px;padding:8px;border-bottom:1px solid var(--border)}
td{padding:9px 8px;border-bottom:1px solid var(--border)}tr:last-child td{border-bottom:0}td.n,th.n{text-align:right}
.list{list-style:none;margin:0;padding:0}.list li{display:flex;align-items:center;gap:var(--s3);padding:10px 0;border-bottom:1px solid var(--border)}.list li:last-child{border-bottom:0}
.grow{flex:1;min-width:0}.meta{color:var(--muted);font-size:12px}
.tag{font-size:11px;padding:1px 8px;border-radius:999px;background:var(--surface2);border:1px solid var(--border);color:var(--muted);white-space:nowrap}
.tag.acc{background:var(--accent-soft);border-color:transparent;color:var(--accent)}.tag.neg{color:var(--neg)}
.tl{position:relative}.tl .d{display:grid;grid-template-columns:72px 1fr;gap:12px;padding:8px 0;border-bottom:1px solid var(--border)}.tl .d:last-child{border-bottom:0}
.tl .dl{font-size:12px;color:var(--muted);text-transform:capitalize}.tl .dl b{display:block;color:var(--text);font-size:15px;font-weight:600}
.tl .d.today .dl b{color:var(--accent)}.ev{display:flex;gap:8px;align-items:baseline;padding:2px 0}.ev .h{font-size:12px;color:var(--muted);width:40px;flex:none}
.legend{display:flex;flex-direction:column;gap:6px;font-size:13px}.legend div{display:flex;align-items:center;gap:8px}.legend i{width:10px;height:10px;border-radius:3px;flex:none}.legend .n{margin-left:auto}
.donutw{display:flex;gap:var(--s5);align-items:center;flex-wrap:wrap}.donutw svg{flex:none}.donutw .legend{flex:1;min-width:160px}
.chart text{fill:var(--muted);font-size:11px}.chart .gl{stroke:var(--border)}
.fg{display:grid;gap:var(--s3);grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
.chk{display:flex;gap:8px;align-items:center;color:var(--text);font-size:13px;margin:0}.chk input{width:auto}
.acts-row{display:flex;gap:var(--s2);flex-wrap:wrap;margin-top:var(--s4)}
.note{font-size:12px;color:var(--warn);margin:0 0 var(--s3)}
.banner{display:flex;gap:var(--s3);align-items:center;padding:12px var(--s4);border:1px solid var(--border);border-left:3px solid var(--accent);background:var(--surface);border-radius:var(--r);margin-bottom:var(--s4)}
.banner .grow b{display:block;font-weight:500}
.skel{opacity:.55;pointer-events:none;user-select:none}
.sk{background:var(--surface2);border-radius:6px;height:10px}
.wip{display:flex;gap:var(--s3);align-items:center;padding:12px var(--s4);border:1px dashed var(--border);border-radius:var(--r);margin-bottom:var(--s4);background:var(--surface)}
.info{font-size:12px;color:var(--muted);border:1px solid var(--border);border-radius:8px;padding:8px 12px;margin-bottom:var(--s4);background:var(--surface)}
.mem{display:grid;grid-template-columns:2fr 1.3fr 1fr;gap:var(--s2);margin-bottom:var(--s2);align-items:end}
@media(max-width:600px){.mem{grid-template-columns:1fr 1fr}.mem>div:first-child{grid-column:span 2}}
dialog.dlg{border:1px solid var(--border);border-radius:14px;padding:0;background:var(--surface);color:var(--text);width:min(640px,94vw);max-height:90vh;box-shadow:0 20px 50px rgba(0,0,0,.25)}
dialog.dlg::backdrop{background:rgba(0,0,0,.4)}.dlg form{display:flex;flex-direction:column;max-height:90vh}.dh{display:flex;align-items:center;padding:14px 18px;border-bottom:1px solid var(--border)}.dh h3{margin:0;flex:1;font-size:15px}
.db{padding:18px;overflow:auto}.df{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px;border-top:1px solid var(--border)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.filters>*{width:auto;min-width:130px;flex:1}
.bar{height:8px;border-radius:99px;background:var(--surface2);border:1px solid var(--border);overflow:hidden}.bar i{display:block;height:100%;background:var(--accent)}.bar i.over{background:var(--neg)}
.prow{display:grid;grid-template-columns:minmax(90px,1fr) 2fr auto;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--border)}.prow:last-child{border-bottom:0}
.months{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}.mcell{border:1px solid var(--border);border-radius:10px;padding:10px 12px;min-height:90px}.mcell.cur{border-color:var(--accent)}.mcell h4{margin:0 0 6px;font-size:13px;display:flex;justify-content:space-between}
.mi{display:flex;justify-content:space-between;gap:8px;font-size:12px;padding:2px 0}.mi.proj{color:var(--muted)}
.pill{display:inline-flex;gap:4px;flex-wrap:wrap}.pos{color:var(--pos)}.neg{color:var(--neg)}
.calg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.calg .h{font-size:11px;color:var(--muted);text-align:center;padding:4px}.calg .c{min-height:84px;border:1px solid var(--border);border-radius:8px;padding:4px 6px;font-size:11px;overflow:hidden}.calg .c.o{opacity:.4}.calg .c.t{border-color:var(--accent)}.calg .c b{font-size:12px}.calg .c div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(max-width:600px){.calg .c{min-height:56px}.calg .c div{display:none}.calg .c.has::after{content:'•';color:var(--accent)}}
.wk{display:grid;grid-template-columns:repeat(7,minmax(110px,1fr));gap:8px;overflow-x:auto}.wk .col{border:1px solid var(--border);border-radius:8px;padding:8px;min-height:120px}.wk .col h4{margin:0 0 6px;font-size:12px;color:var(--muted);font-weight:500}.slot{font-size:12px;border-left:3px solid var(--accent);background:var(--surface2);padding:4px 6px;border-radius:4px;margin-bottom:4px}.slot.c2{border-color:var(--c2)}.slot.c3{border-color:var(--c3)}
.pt{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--border)}.pt:last-child{border-bottom:0}.dot{width:8px;height:8px;border-radius:50%;margin-top:7px;flex:none}.dot.good{background:var(--pos)}.dot.warn{background:var(--warn)}.dot.bad{background:var(--neg)}.dot.info{background:var(--accent);border:0;padding:0;margin:7px 0 0;border-radius:50%;font-size:0}
.score{font-size:28px;font-weight:600;font-variant-numeric:tabular-nums}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
input[type=range]{padding:0;border:0;accent-color:var(--accent)}
.kv{display:grid;grid-template-columns:1fr auto;gap:4px 16px;font-size:13px}.kv span:nth-child(odd){color:var(--muted)}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:8px;display:none;z-index:60;max-width:90vw}
</style>
</head>
<body>
<div class="app" id="app">
 <aside>
  <div class="brand"><div class="logo">CF</div><span>Contas da Família</span></div>
  <nav class="nav" id="nav"></nav>
  <div class="side-foot"><a class="btn ghost" id="btnCollapse" style="width:100%;justify-content:center" title="Recolher menu"></a></div>
 </aside>
 <div id="scrim"></div>
 <div style="min-width:0">
  <header class="topbar">
   <button class="btn icon ghost" id="btnDrawer" aria-label="Menu"></button>
   <h1 id="ttl"></h1>
   <div class="seg" id="seg"></div>
   <select id="selUser" aria-label="Utilizador atual"></select>
   <button class="btn icon" id="btnTheme" aria-label="Alternar tema"></button>
  </header>
  <main id="view"></main>
 </div>
 <nav class="bottom" id="bottom"></nav>
</div>
<div id="toast"></div>
<script>
'use strict';
/* ================= Utilitários pt-PT ================= */
const NF=new Intl.NumberFormat('pt-PT',{style:'currency',currency:'EUR',useGrouping:'always'});

const DF=(o)=>new Intl.DateTimeFormat('pt-PT',o);

const iso=d=>{d=new Date(d);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const addD=(d,n)=>{d=new Date(d);d.setDate(d.getDate()+n);return d};
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',3200)}

/* ================= Camada de dados: coleção 'familia' =================
   Backend atual: localStorage. Para um backend partilhado, substituir apenas `storage`
   (ou reimplementar os métodos de `db` mantendo a mesma assinatura). */
class ConflictError extends Error{constructor(){super('Não foi possível guardar: este registo foi alterado por outra pessoa entretanto. Recarregue a página e volte a aplicar as suas alterações.');this.name='ConflictError'}}
const storage={KEY:'familia',load(){try{return JSON.parse(localStorage.getItem(this.KEY))||[]}catch(e){return[]}},save(d){try{localStorage.setItem(this.KEY,JSON.stringify(d))}catch(e){throw new Error('Espaço de armazenamento local esgotado. Apague anexos grandes ou exporte e limpe dados antigos.')}}};
const db={
 user:()=>localStorage.getItem('cf_user')||'',
 uid:()=>crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2),
 async list(k){return storage.load().filter(d=>!k||d.k===k)},
 async get(id){return storage.load().find(d=>d.id===id)||null},
 async insert(doc){if(!doc||!doc.k)throw new Error('Registo sem tipo (k).');const all=storage.load(),t=new Date().toISOString(),u=db.user();
  const d={...doc,id:doc.id||db.uid(),version:1,criado_por:u,criado_em:t,atualizado_por:u,atualizado_em:t};all.push(d);storage.save(all);return d},
 async update(id,patch,{if_version}={}){const all=storage.load(),i=all.findIndex(d=>d.id===id);if(i<0)throw new Error('Registo não encontrado.');
  if(if_version!=null&&all[i].version!==if_version)throw new ConflictError();
  const {id:_1,k:_2,version:_3,criado_por:_4,criado_em:_5,...p}=patch||{};
  all[i]={...all[i],...p,version:all[i].version+1,atualizado_por:db.user(),atualizado_em:new Date().toISOString()};storage.save(all);return all[i]},
 async remove(id){if(!confirm('Apagar este registo? Esta ação não pode ser desfeita.'))return false;storage.save(storage.load().filter(d=>d.id!==id));return true},
 async exportAll(){return storage.load()},async replaceAll(docs){storage.save(docs)}
};

function range(p,ref=new Date(),off=0){const r=new Date(ref);let a,b;
 if(p==='semana'){const dw=(r.getDay()+6)%7;a=addD(new Date(r.getFullYear(),r.getMonth(),r.getDate()),-dw+7*off);b=addD(a,7)}
 else if(p==='ano'){a=new Date(r.getFullYear()+off,0,1);b=new Date(r.getFullYear()+off+1,0,1)}
 else{a=new Date(r.getFullYear(),r.getMonth()+off,1);b=new Date(r.getFullYear(),r.getMonth()+off+1,1)}
 return{a:iso(a),b:iso(b)}}

/* ================= Componentes ================= */
const emptyState=(t='Sem registos',s='',ic='inbox',action='')=>`<div class="empty"><div class="ic">${icon(ic,16)}</div><b>${esc(t)}</b>${s?`<small>${s}</small>`:''}${action}</div>`;
function deltaHtml(cur,prev,{mode='pct',invert=false,fmt=eur}={}){
 if(cur==null||prev==null||isNaN(cur)||isNaN(prev))return '<span class="delta flat">—</span>';
 const diff=cur-prev;if(Math.abs(diff)<1e-9)return `<span class="delta flat">0 <span class="m">vs ${perLabel[periodo]}</span></span>`;
 const good=invert?diff<0:diff>0,arrow=diff>0?'▲':'▼';
 const txt=mode==='pp'?NN.format(diff*100)+' p.p.':mode==='abs'?fmt(Math.abs(diff)):(prev!==0?NP.format(Math.abs(diff/prev)):fmt(Math.abs(diff)));
 return `<span class="delta ${good?'up':'down'}">${arrow} ${txt} <span class="m">vs ${perLabel[periodo]}</span></span>`}
function spark(vals,color='var(--accent)',w=88,h=28){vals=(vals||[]).filter(v=>v!=null&&!isNaN(v));if(vals.length<2)return `<svg width="${w}" height="${h}"></svg>`;
 const mn=Math.min(...vals),mx=Math.max(...vals),sp=mx-mn||1,pts=vals.map((v,i)=>[i*(w-2)/(vals.length-1)+1,h-2-(v-mn)/sp*(h-4)]);
 const d=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join('');
 return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true"><path d="${d}" fill="none" stroke="${color}" stroke-width="1.5" stroke-linejoin="round"/></svg>`}
function kpiCard({label,value,delta='',sparkVals=null,hint='',tag=''}){return `<div class="card kpi"><div class="l"><span>${esc(label)}</span>${tag}</div><div class="v num">${value}</div><div class="f"><div>${delta}${hint?`<div class="meta">${hint}</div>`:''}</div>${sparkVals?spark(sparkVals):''}</div></div>`}
function card({title,sub='',actions='',body,span=6,id='',cls=''}){return `<section class="card span-${span} ${cls}" ${id?`id="${id}"`:''}><div class="ch"><h3>${esc(title)}${sub?` <span class="sub">· ${esc(sub)}</span>`:''}</h3><div class="acts">${actions}</div></div><div class="cb">${body}</div></section>`}
const chartCard=o=>card(o),tableCard=o=>card({...o,body:o.rows&&o.rows.length?table(o.cols,o.rows):emptyState(o.emptyT,o.emptyS)}),listCard=o=>card({...o,body:o.items&&o.items.length?`<ul class="list">${o.items.join('')}</ul>`:emptyState(o.emptyT,o.emptyS)});
function table(cols,rows){return `<div style="overflow-x:auto"><table><thead><tr>${cols.map(c=>`<th class="${c.n?'n':''}">${esc(c.t)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map((v,i)=>`<td class="${cols[i].n?'n':''}">${v}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
/* Gráficos SVG */
const nice=(mn,mx,n=4)=>{if(mn===mx){mx=mn+1}const st=Math.pow(10,Math.floor(Math.log10((mx-mn)/n)));const step=[1,2,2.5,5,10].map(m=>m*st).find(s=>(mx-mn)/s<=n)||st*10;const a=Math.floor(mn/step)*step,b=Math.ceil(mx/step)*step;const t=[];for(let v=a;v<=b+step/2;v+=step)t.push(v);return t};
function lineChart(series,labels,{area=false,h=220,fmt=compact}={}){
 const W=640,H=h,L=48,R=10,T=10,B=26,all=series.flatMap(s=>s.data).filter(v=>v!=null);if(!all.length)return '';
 const ticks=nice(Math.min(0,...all)<0?Math.min(...all):Math.min(...all)*0.95,Math.max(...all)),mn=ticks[0],mx=ticks[ticks.length-1];
 const x=i=>L+(labels.length<2?0:i*(W-L-R)/(labels.length-1)),y=v=>T+(1-(v-mn)/(mx-mn||1))*(H-T-B);
 let g=ticks.map(t=>`<line class="gl" x1="${L}" x2="${W-R}" y1="${y(t)}" y2="${y(t)}"/><text x="${L-8}" y="${y(t)+4}" text-anchor="end">${fmt(t)}</text>`).join('');
 const every=Math.ceil(labels.length/8);g+=labels.map((l,i)=>i%every===0||i===labels.length-1?`<text x="${x(i)}" y="${H-8}" text-anchor="middle">${esc(l)}</text>`:'').join('');
 series.forEach((s,si)=>{const pts=s.data.map((v,i)=>v==null?null:[x(i),y(v)]).filter(Boolean);if(!pts.length)return;const d=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join('');const c=s.color||`var(--c${si+1})`;
  if(area)g+=`<defs><linearGradient id="ag${si}" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="${c}" stop-opacity=".18"/><stop offset="1" stop-color="${c}" stop-opacity="0"/></linearGradient></defs><path d="${d}L${pts[pts.length-1][0]} ${y(mn)}L${pts[0][0]} ${y(mn)}Z" fill="url(#ag${si})"/>`;
  g+=`<path d="${d}" fill="none" stroke="${c}" stroke-width="2" stroke-linejoin="round"/>`;const lp=pts[pts.length-1];g+=`<circle cx="${lp[0]}" cy="${lp[1]}" r="3" fill="${c}"/>`});
 return `<svg class="chart" viewBox="0 0 ${W} ${H}" width="100%" role="img">${g}</svg>`}
const areaChart=(s,l,o={})=>lineChart(s,l,{...o,area:true});
function barChart(items,{h=220,fmt=compact}={}){const W=640,H=h,L=48,R=10,T=10,B=26;if(!items.length)return '';
 const vals=items.flatMap(i=>[i.v,i.v2||0]),ticks=nice(Math.min(0,...vals),Math.max(0,...vals)),mn=ticks[0],mx=ticks[ticks.length-1],y=v=>T+(1-(v-mn)/(mx-mn||1))*(H-T-B);
 const bw=(W-L-R)/items.length;let g=ticks.map(t=>`<line class="gl" x1="${L}" x2="${W-R}" y1="${y(t)}" y2="${y(t)}"/><text x="${L-8}" y="${y(t)+4}" text-anchor="end">${fmt(t)}</text>`).join('');
 items.forEach((it,i)=>{const two=it.v2!=null,w=bw*(two?.32:.6),x0=L+i*bw+bw*(two?.16:.2);const bar=(v,x,c)=>`<rect x="${x}" y="${Math.min(y(v),y(0))}" width="${w}" height="${Math.abs(y(v)-y(0))}" rx="3" fill="${c}"/>`;
  g+=bar(it.v,x0,it.c||'var(--c1)');if(two)g+=bar(it.v2,x0+w+2,'var(--c6)');g+=`<text x="${L+i*bw+bw/2}" y="${H-8}" text-anchor="middle">${esc(it.l)}</text>`});
 return `<svg class="chart" viewBox="0 0 ${W} ${H}" width="100%" role="img">${g}</svg>`}
function donutChart(items,{size=168,center='',sub=''}={}){const tot=items.reduce((s,i)=>s+i.v,0);if(!tot)return '';const r=size/2-12,c=2*Math.PI*r;let off=0;
 const segs=items.map((it,i)=>{const len=it.v/tot*c,s=`<circle r="${r}" cx="${size/2}" cy="${size/2}" fill="none" stroke="${it.c||`var(--c${i%6+1})`}" stroke-width="18" stroke-dasharray="${len} ${c-len}" stroke-dashoffset="${-off}" transform="rotate(-90 ${size/2} ${size/2})"/>`;off+=len;return s}).join('');
 return `<div class="donutw"><svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" role="img"><circle r="${r}" cx="${size/2}" cy="${size/2}" fill="none" stroke="var(--surface2)" stroke-width="18"/>${segs}<text x="50%" y="48%" text-anchor="middle" style="font-size:15px;font-weight:600;fill:var(--text)" class="num">${center}</text><text x="50%" y="60%" text-anchor="middle" style="font-size:11px;fill:var(--muted)">${sub}</text></svg>
 <div class="legend">${items.map((it,i)=>`<div><i style="background:${it.c||`var(--c${i%6+1})`}"></i>${esc(it.l)}<span class="n num">${eur0(it.v)} <span class="meta">${NP.format(it.v/tot)}</span></span></div>`).join('')}</div></div>`}

 const vals=Object.values(latest).map(x=>x.p).filter(p=>!p.vencido);if(!vals.length)return null;return vals.reduce((s,p)=>s+(p.passivo?-1:1)*Math.abs(+p.valor||0),0)}
function movStats(movs,{a,b}){const m=movs.filter(x=>x.data>=a&&x.data<b&&!x.beneficio);const inc=m.filter(x=>+x.valor>0).reduce((s,x)=>s+ +x.valor,0),exp=m.filter(x=>+x.valor<0).reduce((s,x)=>s- x.valor,0);

function parseCSV(text,delim){text=String(text).replace(/^\uFEFF/,'');if(!delim){const l=text.split(/\r?\n/).slice(0,15).join('\n');delim=[';',',','\t'].sort((a,b)=>l.split(b).length-l.split(a).length)[0]}
 const rows=[];let row=[],cur='',q=false;for(let i=0;i<text.length;i++){const c=text[i];if(q){if(c==='"'){if(text[i+1]==='"'){cur+='"';i++}else q=false}else cur+=c}else if(c==='"')q=true;else if(c===delim){row.push(cur);cur=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cur);rows.push(row);row=[];cur=''}else cur+=c}
 if(cur!==''||row.length){row.push(cur);rows.push(row)}return{rows:rows.filter(r=>r.some(x=>String(x).trim()!=='')).map(r=>r.map(x=>String(x).trim())),delim}}
function parseNumStr(s,dec=','){if(s==null)return null;s=String(s).trim().replace(/[€$£\s\u00a0]/g,'');if(!s)return null;let neg=false;if(/^\(.*\)$/.test(s)){neg=true;s=s.slice(1,-1)}if(s.endsWith('-')){neg=true;s=s.slice(0,-1)}
 if(dec===',')s=s.replace(/\./g,'').replace(',','.');else s=s.replace(/,/g,'');const n=Number(s);return isNaN(n)?null:(neg?-n:n)}
function parseDateStr(s,fmt){s=String(s||'').trim();let m;if(fmt==='yyyy-mm-dd'){m=s.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/);return m?`${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`:null}
 m=s.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2,4})/);if(!m)return null;let a=m[1],b=m[2],y=m[3];if(y.length===2)y='20'+y;if(fmt==='mm/dd/yyyy'){const t=a;a=b;b=t}if(+b>12||+a>31)return null;return `${y}-${b.padStart(2,'0')}-${a.padStart(2,'0')}`}

async function importAutomacao(payload,{silencioso=false}={}){if(typeof payload==='string')payload=JSON.parse(payload);const docs=Array.isArray(payload)?payload:payload.docs;if(!Array.isArray(docs))throw new Error('Formato inválido: falta a lista "docs".');
 const bad=docs.filter(d=>!d||!K_OK.includes(d.k));if(bad.length)throw new Error(`${bad.length} registos com tipo (k) não permitido. Tipos aceites: ${K_OK.join(', ')}.`);
 const all=await db.list(),ids=new Set(all.map(d=>d.id)),ins=docs.filter(d=>!d.id||!ids.has(d.id)),upd=docs.filter(d=>d.id&&ids.has(d.id));

 if(!silencioso&&!confirm(`Importar resultado da automação "${payload.job||'—'}"?\n\n${ins.length} novos, ${upd.length} atualizações (com verificação de versão).\n${Object.entries(por).map(([k,n])=>`${k}: ${n}`).join(', ')}`))return null;
 let ok=0,conf=0;for(const d of ins){const{id,version,criado_por,criado_em,atualizado_por,atualizado_em,...r}=d;await db.insert({...r,...(id?{id}:{}),origem:r.origem||'automacao'});ok++}
 for(const d of upd){const cur=all.find(x=>x.id===d.id);try{await db.update(d.id,d,{if_version:d.version!=null?d.version:cur.version});ok++}catch(e){if(e.name==='ConflictError')conf++;else throw e}}
 await db.insert({k:'execucao',job:payload.job||'importacao',inicio:payload.inicio||new Date().toISOString(),fim:payload.fim||new Date().toISOString(),estado:payload.estado||(conf?'aviso':'ok'),n:ok,mensagem:payload.mensagem||`${ins.length} novos, ${upd.length-conf} atualizados${conf?`, ${conf} conflitos de versão ignorados`:''}`});return{ok,conf,novos:ins.length}}

async function auditar(gatilho='manual'){const ps=PS(),movs=await db.list('mov'),pats=await db.list('pat'),orcs=await db.list('orc'),c=await carteiraCalc(),hoje=new Date();
 const y={a:iso(addD(hoje,-365)),b:iso(addD(hoje,1))},l=inR(movs,y),R=rendim(l),Dsp=despesa(l),mDesp=Dsp/12,out=[];const add=(id,nivel,titulo,texto,valor)=>out.push({id,nivel,titulo,texto,valor});
 if(!l.length)add('dados','info','Sem movimentos nos últimos 12 meses','Sem dados, o Auditor não consegue avaliar poupança nem fundo de emergência.',null);
 else{const t=R?(R-Dsp)/R:null;if(t!=null&&ps.taxa_poupanca_alvo!=null)add('poupanca',t*100<ps.taxa_poupanca_alvo?(t<0?'bad':'warn'):'good','Taxa de poupança',`Nos últimos 12 meses pouparam ${pct(t)} do rendimento (${eur0(R-Dsp)} de ${eur0(R)}). Alvo definido: ${NN.format(ps.taxa_poupanca_alvo)} %.${t*100<ps.taxa_poupanca_alvo?` Para atingir o alvo faltam ${eur0(R*ps.taxa_poupanca_alvo/100-(R-Dsp))} por ano. Que despesa cortariam primeiro?`:''}`,t)}
 const lat={};pats.forEach(x=>{if(!lat[x.item]||x.data>=lat[x.item].data)lat[x.item]=x});const L=Object.values(lat).filter(x=>!x.vencido),liq=sum(L.filter(x=>x.categoria==='conta'),x=>x.valor);
 if(mDesp>0&&ps.fundo_emergencia_meses!=null){const m=liq/mDesp;add('emergencia',m<ps.fundo_emergencia_meses?(m<ps.fundo_emergencia_meses/2?'bad':'warn'):'good','Fundo de emergência',`A liquidez registada (${eur0(liq)}) cobre ${NN.format(m)} meses de despesa média (${eur0(mDesp)}/mês). Alvo: ${ps.fundo_emergencia_meses} meses.`,m);
  const exc=liq-ps.fundo_emergencia_meses*mDesp;if(exc>0&&ps.retorno_invest!=null){const r=(1+ps.retorno_invest/100)/(1+(ps.inflacao||0)/100)-1;add('liquidez',exc>mDesp*3?'warn':'info','Liquidez parada',`Há ${eur0(exc)} acima do fundo de emergência. Ao retorno real assumido (${pct(r)}), o custo de oportunidade é de cerca de ${eur0(exc*r)} por ano. Está reservado para alguma despesa planeada?`,exc*r)}}
 const val=sum(c.pos,x=>x.valor??x.custo);if(val>0&&ps.concentracao_max!=null){const by={};c.pos.forEach(x=>by[x.ticker]=(by[x.ticker]||0)+(x.valor??x.custo));const[tk,v]=Object.entries(by).sort((a,b)=>b[1]-a[1])[0];const w=v/val;
  add('concentracao',w*100>ps.concentracao_max?'warn':'good','Concentração da carteira',`A maior posição (${tk}) pesa ${pct(w)} da carteira (${eur0(v)}). Limite definido: ${ps.concentracao_max} %.${w*100>ps.concentracao_max?' Se esta posição caísse 30 %, perdiam '+eur0(v*0.3)+'.':''}`,w)}
 const tx=c.tx.filter(t=>t.data>=y.a),fees=sum(tx,t=>t.comissao),vol=sum(tx.filter(t=>t.tipo==='compra'),t=>t.quantidade*t.preco);if(tx.length&&ps.comissoes_max!=null){const f=vol?fees/vol:0;add('comissoes',f*100>ps.comissoes_max?'warn':'good','Comissões',`Pagaram ${eur(fees)} em comissões em ${tx.length} transações nos últimos 12 meses (${NP.format(f)} do valor comprado). Limite: ${NN.format(ps.comissoes_max)} %.`,fees)}
 const div=sum(L.filter(x=>x.passivo),x=>x.valor);if(div>0&&R>0&&ps.divida_rendimento_max!=null){const a=div/R;add('divida',a>ps.divida_rendimento_max?'bad':a>ps.divida_rendimento_max*0.75?'warn':'good','Dívida',`A dívida (${eur0(div)}) equivale a ${NN.format(a)} anos de rendimento líquido. Limite definido: ${NN.format(ps.divida_rendimento_max)}. Amortizar antecipadamente compensa face ao retorno esperado de ${NN.format(ps.retorno_invest??0)} %?`,a)}
 const pm=range('mes',hoje,-1),lm=inR(movs,pm);const over=orcs.map(o=>({o,g:despesa(lm.filter(m=>m.categoria===o.categoria))})).filter(x=>x.g>x.o.mensal);if(over.length)add('orcamento','warn','Orçamento ultrapassado no mês passado',over.map(x=>`${x.o.categoria}: ${eur0(x.g)} para ${eur0(x.o.mensal)}`).join('; ')+'.',sum(over,x=>x.g-x.o.mensal));
 const cv=L.filter(x=>x.categoria==='certificado'&&x.vencimento&&x.vencimento<iso(hoje));if(cv.length)add('certificados','warn','Certificados com vencimento passado',`${cv.map(x=>x.item).join(', ')}: confirme se foram resgatados e marque-os como vencidos para não contar duas vezes.`,null);
 if(!out.length)add('vazio','info','Sem dados suficientes','Registe movimentos, património e carteira para o Auditor poder desafiar as decisões.',null);
 return db.insert({k:'auditoria',data:iso(hoje),gatilho,desafios:out})}
